<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · RhythmScore</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    color:#eef3ff;background:#0d1020;min-height:100vh;display:grid;place-items:center;text-align:center;
  }
  .bg{position:fixed;inset:0;z-index:-1;background:

    linear-gradient(160deg,#0b0f22 0%,#121428 45%,#0e1226 100%)}
  .num{font-size:96px;font-weight:800;background:linear-gradient(120deg,#fff,#9cc8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-size:22px;margin:10px 0 8px}
  p{color:#aab6d4;font-size:14px;margin-bottom:28px}
  a{display:inline-block;padding:11px 28px;border-radius:12px;color:#fff;text-decoration:none;font-size:14px;font-weight:600;
    background:linear-gradient(135deg,#4b98e7,#7b5cf0);box-shadow:0 8px 22px rgba(90,120,240,.35)}
</style>
</head>
<body>
<div class="bg"></div>
<div>
  <div class="num">404</div>
